name: Update Overwatch Meta

on:
  schedule:
    - cron: '15 9 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-overwatch-meta
  cancel-in-progress: false

jobs:
  sync-meta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync meta from Blizzard
        run: npm run sync:meta

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- src/data/meta.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/meta.json
          git commit -m "chore: weekly Overwatch meta sync"
          git push
