name: Update Overwatch Meta

on:
  schedule:
    # 09:00 UTC = 12:00 MSK, every Tuesday.
    - cron: '0 9 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-overwatch-meta
  cancel-in-progress: false

jobs:
  sync-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify live Blizzard sources in browser
        run: npm run verify:browser

      - name: Sync meta from Blizzard
        run: npm run sync:meta

      - name: Validate synced data
        run: npm test

      - name: Lint site
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Verify built site
        run: npm run verify:site

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- src/data/meta.json src/data/patches.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Weekly Overwatch meta sync"
            echo ""
            echo "- Data changed: yes"
            echo "- Validation: npm run verify:browser, npm test, npm run lint, npm run build, npm run verify:site"
            echo "- Files:"
            git diff --name-only -- src/data/meta.json src/data/patches.json | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report no data changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          {
            echo "### Weekly Overwatch meta sync"
            echo ""
            echo "- Data changed: no"
            echo "- Validation still passed: npm run verify:browser, npm test, npm run lint, npm run build, npm run verify:site"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/meta.json src/data/patches.json
          git commit -m "chore: weekly Overwatch meta sync"
          git push
